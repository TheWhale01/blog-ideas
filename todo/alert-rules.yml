# GENERATED ARTIFACT — source of truth is now erebos:sys/services/monitoring/prometheus/config.nix
# (Nix attrsets rendered by pkgs.formats.yaml into services.prometheus.ruleFiles; promtool runs at BUILD time).
# Snapshot below = store-rendered output of commit 98a56d4, promtool check (12 rules) + alert-rules.test.yml both SUCCESS 2026-11-10.
groups:
- name: systemd_services
  rules:
  - alert: ServiceCrashed
    annotations:
      description: '{{ $labels.name }} entered failed state on {{ $labels.instance
        }}.'
      summary: 'Service crashed: {{ $labels.name }}'
    expr: node_systemd_unit_state{name=~".+\\.service",state="failed"} == 1
    for: 1m
    labels:
      severity: critical
  - alert: ServiceOffline
    annotations:
      description: Watched service {{ $labels.name }} not active for 5m on {{ $labels.instance
        }} (covers daily update-containers restarts).
      summary: 'Service offline: {{ $labels.name }}'
    expr: node_systemd_unit_state{name=~"(matrix-synapse|mas|matrix-alertmanager|prometheus|prometheus-node-exporter|alertmanager|grafana|loki|alloy|traefik|nginx|postgresql|redis-immich|immich-server|vaultwarden|n8n|jellyfin|hermes-agent|netbird|sshd|podman-.*|homepage-dashboard|seerr|sonarr|radarr|prowlarr|livekit).*\\.service",type!~"oneshot.*",state="active"}
      == 0
    for: 5m
    labels:
      severity: warning
- name: host_resources
  rules:
  - alert: DiskSpaceLow
    annotations:
      summary: Disk low on {{ $labels.mountpoint }} ({{ $value | humanizePercentage
        }} free)
    expr: node_filesystem_avail_bytes{mountpoint=~"/|/data",fstype!~"tmpfs|overlay|ramfs"}
      / node_filesystem_size_bytes{mountpoint=~"/|/data"} < 0.10
    for: 30m
    labels:
      severity: warning
  - alert: DiskSpaceCritical
    annotations:
      summary: Disk CRITICAL on {{ $labels.mountpoint }} ({{ $value | humanizePercentage
        }} free)
    expr: node_filesystem_avail_bytes{mountpoint=~"/|/data",fstype!~"tmpfs|overlay|ramfs"}
      / node_filesystem_size_bytes{mountpoint=~"/|/data"} < 0.05
    for: 10m
    labels:
      severity: critical
  - alert: FilesystemReadOnly
    annotations:
      summary: '{{ $labels.mountpoint }} remounted READ-ONLY (device: {{ $labels.device
        }})'
    expr: node_filesystem_readonly{fstype!~"tmpfs|overlay|ramfs"} == 1
    for: 5m
    labels:
      severity: critical
  - alert: MemoryLow
    annotations:
      summary: Available memory <10% on {{ $labels.instance }}
    expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
    for: 5m
    labels:
      severity: warning
  - alert: CPUSaturated
    annotations:
      summary: CPU >90% sustained 15m on {{ $labels.instance }}
    expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
    for: 15m
    labels:
      severity: warning
  - alert: HostRebooted
    annotations:
      summary: '{{ $labels.instance }} rebooted'
    expr: changes(node_boot_time_seconds[10m]) > 0
    labels:
      severity: info
- name: monitoring_self
  rules:
  - alert: ScrapeTargetDown
    annotations:
      summary: Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }})
    expr: up == 0
    for: 5m
    labels:
      severity: critical
  - alert: AlloyConfigNotLoaded
    annotations:
      summary: Alloy last config load failed — pipeline frozen on stale config
    expr: alloy_config_last_load_successful != 1
    for: 5m
    labels:
      severity: critical
  - alert: LokiDroppingEntries
    annotations:
      summary: 'Alloy dropping entries: {{ $value | humanize }} dropped in 15m'
    expr: increase(loki_write_dropped_entries_total[15m]) > 0
    for: 10m
    labels:
      severity: warning
  - alert: LogsPipelineStalled
    annotations:
      summary: No log lines received 30m while Loki up — journal->alloy->loki chain
        stalled
    expr: rate(loki_distributor_lines_received_total[15m]) == 0 unless on (instance)
      (up{job="loki"} == 0)
    for: 30m
    labels:
      severity: warning
